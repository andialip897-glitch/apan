<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ APAN · GALAXY LIGHT ✨</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:'Segoe UI',sans-serif;
}

/* ===== BACKGROUND GALAXY ===== */
.galaxy{
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(120,0,255,0.35), transparent 60%),
    radial-gradient(ellipse at 80% 70%, rgba(0,200,255,0.30), transparent 60%),
    radial-gradient(ellipse at 50% 50%, rgba(255,0,150,0.20), transparent 70%),
    radial-gradient(ellipse at 70% 20%, rgba(0,255,180,0.15), transparent 55%),
    #000010;
  z-index:0;
  animation:galaxyShift 25s ease-in-out infinite alternate;
}

@keyframes galaxyShift{
  0%{filter:hue-rotate(0deg);}
  100%{filter:hue-rotate(40deg);}
}

/* ===== BINTANG ===== */
.stars, .stars2, .stars3{
  position:fixed;
  inset:0;
  z-index:1;
  background-repeat:repeat;
  pointer-events:none;
}

.stars{
  background-image:
    radial-gradient(2px 2px at 20px 30px, #fff, transparent),
    radial-gradient(1px 1px at 60px 80px, #fff, transparent),
    radial-gradient(2px 2px at 120px 50px, #fff, transparent),
    radial-gradient(1px 1px at 180px 150px, #fff, transparent),
    radial-gradient(2px 2px at 250px 100px, #fff, transparent),
    radial-gradient(1px 1px at 300px 200px, #fff, transparent),
    radial-gradient(2px 2px at 400px 60px, #fff, transparent),
    radial-gradient(1px 1px at 500px 180px, #fff, transparent);
  background-size:600px 300px;
  animation:twinkle 3s infinite alternate;
  opacity:0.9;
}

.stars2{
  background-image:
    radial-gradient(1px 1px at 40px 40px, #aaddff, transparent),
    radial-gradient(2px 2px at 150px 90px, #ffddaa, transparent),
    radial-gradient(1px 1px at 260px 160px, #fff, transparent),
    radial-gradient(2px 2px at 380px 40px, #aaffcc, transparent),
    radial-gradient(1px 1px at 520px 220px, #ffaaff, transparent);
  background-size:700px 350px;
  animation:twinkle 5s infinite alternate-reverse;
  opacity:0.7;
}

.stars3{
  background-image:
    radial-gradient(3px 3px at 80px 60px, #ffffff, transparent),
    radial-gradient(2px 2px at 320px 120px, #ccffff, transparent);
  background-size:800px 400px;
  animation:twinkle 2s infinite alternate;
  opacity:0.5;
}

@keyframes twinkle{
  0%{opacity:0.3;}
  100%{opacity:1;}
}

/* ===== TULISAN APAN ===== */
.apung{
  position:relative;
  z-index:10;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:clamp(90px, 22vw, 240px);
  font-weight:900;
  letter-spacing:8px;
  text-transform:uppercase;
  background:linear-gradient(90deg,
    #ff0000, #ff8800, #ffee00, #00ff44,
    #00ddff, #4444ff, #cc00ff, #ff0066, #ff0000);
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:rainbowMove 4s linear infinite, glowPulse 1.5s ease-in-out infinite alternate;
  filter:drop-shadow(0 0 25px #ffffff88)
         drop-shadow(0 0 55px #00e5ff99)
         drop-shadow(0 0 90px #ff00ff77);
}

@keyframes rainbowMove{
  0%{background-position:0% 50%;}
  100%{background-position:300% 50%;}
}

@keyframes glowPulse{
  0%{
    transform:scale(1);
    filter:drop-shadow(0 0 20px #fff8)
           drop-shadow(0 0 40px #00e5ff77)
           drop-shadow(0 0 70px #ff00ff55);
  }
  100%{
    transform:scale(1.06);
    filter:drop-shadow(0 0 40px #ffffffee)
           drop-shadow(0 0 80px #00e5ffff)
           drop-shadow(0 0 120px #ff00ffff);
  }
}

/* ===== SUBTITLE ===== */
.sub{
  position:fixed;
  bottom:30px;
  width:100%;
  text-align:center;
  z-index:10;
  color:#8892b0;
  font-size:13px;
  letter-spacing:3px;
  text-shadow:0 0 12px #00e5ff66;
  animation:twinkle 2s infinite alternate;
}
</style>
</head>
<body>

<!-- Background Galaxy -->
<div class="galaxy"></div>
<div class="stars"></div>
<div class="stars2"></div>
<div class="stars3"></div>

<!-- Tulisan APAN -->
<div class="apung">APAN</div>

<div class="sub">⚡ TEKEN😈😈 · PEPENG☠️☠️⚡</div>

</body>
</html>
